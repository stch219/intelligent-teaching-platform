# ============================================================================
# 【功能】智能教学平台 生产环境 Nginx 配置（阶段9发布）
# ----------------------------------------------------------------------------
# 【说明】
#   1. 架构：Nginx 托管前端静态资源(ruoyi-ui/dist) + 反向代理后端 8080
#   2. 约定：前端打包时 VITE_APP_BASE_API=/prod-api，故 API 统一走
#      /prod-api/ 前缀转发（等价于开发环境 vite proxy 的生产替身）
#   3. WebSocket：消息系统端点 /websocket/message 需单独 location 支持
#      HTTP/1.1 升级（Upgrade/Connection 头），超时调大防长连接被断
#   4. 使用：将 server 段中 root 改为实际 dist 部署路径后
#      nginx -s reload 生效（Windows: nginx.exe -c 绝对路径\nginx.conf）
# ============================================================================

server {
    listen       80;                 # 对外服务端口
    server_name  localhost;          # 有域名时改为实际域名

    # ---------------- 前端静态资源（Vue3 打包产物） ----------------
    location / {
        root   /usr/share/nginx/html/itp-dist;   # TODO: 改为 dist 实际路径
        index  index.html;
        try_files $uri $uri/ /index.html;        # history 路由刷新兜底
    }

    # ---------------- 后端 API 反向代理 ----------------
    # 前端所有请求形如 /prod-api/xxx，去掉前缀后转发到 Spring Boot 8080
    location /prod-api/ {
        proxy_pass http://localhost:8080/;       # 末尾 / 会剥掉 /prod-api 前缀
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;                # 允许上传较大附件/名单文件
    }

    # ---------------- WebSocket 实时消息代理 ----------------
    # 消息系统长连接端点：/websocket/message?token=xxx
    location /websocket/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;                  # ws 升级必须 HTTP/1.1
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";   # 协议升级握手头
        proxy_set_header Host       $host;
        proxy_read_timeout  3600s;               # 心跳间隔内不断开
        proxy_send_timeout  3600s;
    }

    # ---------------- 静态资源缓存与压缩 ----------------
    # Vite 构建产物文件名带 hash，可长缓存；html 不缓存保证发版即生效
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        root  /usr/share/nginx/html/itp-dist;    # TODO: 与上方 root 保持一致
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root  /usr/share/nginx/html/itp-dist;    # TODO: 与上方 root 保持一致
        add_header Cache-Control "no-cache";
    }
}
